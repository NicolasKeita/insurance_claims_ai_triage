services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: insurance_claims
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d insurance_claims"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
