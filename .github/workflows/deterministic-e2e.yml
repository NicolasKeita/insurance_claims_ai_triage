name: Deterministic end-to-end evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  controlled-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/e2e -m unit
