<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10181d" />
    <style>
      html {
        background: #10181d;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #f5f7f7;
        color-scheme: light;
      }
    </style>
    <script id="theme-bootstrap">
      try {
        if (localStorage.getItem('claims-review-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // Keep the dark default when browser storage cannot be read.
      }
    </script>
    <meta
      name="description"
      content="Evidence-grounded insurance claim review for human decision makers."
    />
    <title>Claim Review · Insurance AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
