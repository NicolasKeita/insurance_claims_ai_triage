"A collision claim needs a completed claim form, an account of the collision, and an itemized garage repair estimate. For claimed headlight or body panel damage, provide photographs of the affected parts. If third-party involvement is reported, include an accident report describing that involvement. Missing evidence does not itself establish an exclusion; the handling procedure explains follow-up." = "Un dossier de collision nécessite un formulaire de déclaration rempli, un récit de la collision et un devis de réparation détaillé établi par un garage. Pour les dommages déclarés aux phares ou aux panneaux de carrosserie, fournissez des photographies des pièces concernées. Si l’implication d’un tiers est signalée, joignez un constat décrivant cette implication. L’absence de justificatifs ne suffit pas, à elle seule, à établir une exclusion ; la procédure de gestion explique les démarches à suivre."
