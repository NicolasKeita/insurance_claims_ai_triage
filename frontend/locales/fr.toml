"AI-assisted guidance. Final decisions remain human." = "Une aide par l’IA. La décision finale reste humaine."
"AUTO_COLLISION claim for a Renault Clio (2021) resulting from a front collision in Bordeaux on 2026-09-20. The repair estimate is 2200 EUR, with damage declared to the front bumper. The investigation assessment highlights an additional quote for damage to the hood. The triage assessment recommends a standard review priority. The policy covers accidental physical damage to the insured vehicle resulting from a collision with another vehicle or a fixed object. The deductible is EUR 300." = "Dossier AUTO_COLLISION concernant une Renault Clio (2021), à la suite d’une collision frontale à Bordeaux le 2026-09-20. Le montant estimé des réparations est de 2200 EUR et les dommages déclarés concernent le pare-chocs avant. L’évaluation d’investigation relève un devis supplémentaire pour des dommages au capot. L’évaluation de triage recommande une priorité d’examen standard. Le contrat couvre les dommages matériels accidentels au véhicule assuré résultant d’une collision avec un autre véhicule ou un objet fixe. La franchise est de 300 EUR."
"AUTO_PREMIUM covers accidental physical damage to the insured vehicle resulting from a collision with another vehicle or a fixed object. A collision while parking is included. Coverage applies to repair of collision damage, subject to the deductible, covered parts, and exclusions in this demo policy." = "AUTO_PREMIUM couvre les dommages matériels accidentels au véhicule assuré résultant d’une collision avec un autre véhicule ou un objet fixe. Les collisions pendant le stationnement sont incluses. La couverture s’applique à la réparation des dommages de collision, sous réserve de la franchise, des pièces couvertes et des exclusions prévues par ce contrat de démonstration."
