[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-claims"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "pypdf>=6,<7",
    "ollama>=0.6.2,<0.7",
    "PyMuPDF>=1.28,<2",
    "pytesseract>=0.3.13,<0.4",

    "numpy>=2,<3",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

