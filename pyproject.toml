[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-claims"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=1.2,<1.3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "qdrant-client>=1.19,<1.20",
    "sentence-transformers>=6.1,<6.2",
    "pydantic>=2",
    "pypdf>=6,<7",
    "ollama>=0.6.2,<0.7",
    "PyMuPDF>=1.28,<2",
    "pytesseract>=0.3.13,<0.4",
    "numpy>=2,<3",
    "shapely>=2.1,<3",
    "pandas>=2.2,<4",
    "shap>=0.52,<0.53",
    "matplotlib>=3.10,<4",
    "fastapi[standard]>=0.141,<0.142",

    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4,<2",

    "mlflow>=3.16,<3.17",
]

[project.optional-dependencies]
cardd-hf = [
    "fiftyone>=1.22.1,<1.23; python_version < '3.14'",
    "huggingface-hub>=1.33,<3",
    "Pillow>=12,<13",
]
vision = [
    "ultralytics>=8.4.175,<8.5",
    "Pillow>=12,<13",
    # CPU, CUDA and macOS builds satisfy the same portable version constraints.
    # Select the wheel backend explicitly during installation, not at pytest startup.
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
]
dev = [
    "pytest>=8",
    "nk-python-style",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: fast tests without external services or model checkpoints",
    "integration: real database, service or model integration",
    "vision: real inference in the current Python environment with an existing local checkpoint (no downloads)",
    "rag: retrieval integration using an isolated Qdrant collection and a real embedding model",
    "postgres: integration using the dedicated PostgreSQL test database",
    "qdrant: integration using an isolated temporary Qdrant collection",
]

