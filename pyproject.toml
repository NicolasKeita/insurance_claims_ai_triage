[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-claims"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

