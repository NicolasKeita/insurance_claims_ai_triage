[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-claims"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=1.2,<1.3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "qdrant-client>=1.19,<1.20",
    "sentence-transformers>=6.1,<6.2",
    "pydantic>=2",
    "pypdf>=6,<7",
    "ollama>=0.6.2,<0.7",
    "PyMuPDF>=1.28,<2",
    "pytesseract>=0.3.13,<0.4",
    "numpy>=2,<3",
    "shapely>=2.1,<3",
    "pandas>=2.2,<4",
    "shap>=0.52,<0.53",
    "matplotlib>=3.10,<4",
    "fastapi[standard]>=0.141,<0.142",

    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4,<2",

    "mlflow>=3.16,<3.17",
]

[project.optional-dependencies]
cardd-hf = [
    "fiftyone>=1.22.1,<1.23; python_version < '3.14'",
    "huggingface-hub>=1.33,<3",
    "Pillow>=12,<13",
]
vision = [
    "ultralytics>=8.4.175,<8.5",
    "Pillow>=12,<13",
]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "vision: opt-in vision integration requiring RUN_VISION_TESTS=1 and an existing local damage checkpoint (no downloads)",
    "rag: opt-in retrieval integration requiring RUN_RAG_TESTS=1, Qdrant and a real embedding model",
    "postgres: integration tests requiring a dedicated TEST_DATABASE_URL",
    "qdrant: integration tests requiring explicit RUN_QDRANT_TESTS=1 and QDRANT_URL",
]

