[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-claims"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "pypdf>=6,<7",
    "ollama>=0.6.2,<0.7",
    "PyMuPDF>=1.28,<2",
    "pytesseract>=0.3.13,<0.4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "shap>=0.52,<0.53",
    "matplotlib>=3.10,<4",
    "fastapi[standard]>=0.141,<0.142",

    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4,<2",

    "mlflow>=3.16,<3.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

